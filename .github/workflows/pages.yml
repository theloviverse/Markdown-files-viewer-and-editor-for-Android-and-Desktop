name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "claude/markdown-editor-viewer-nrun01"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Egyszerre csak egy deploy fusson, a folyamatban lévőt ne szakítsa meg.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
