<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Reszponzív, tiszta dizájnú, teljesen offline webes Markdown megjelenítő és szerkesztő — sötét móddal, drag & drop támogatással, kódszínezéssel és táblázatokkal. Mobilra és desktopra optimalizálva." />
  <title>Markdown Megjelenítő &amp; Szerkesztő</title>

  <!-- PWA: telepíthető alkalmazás (csak HTTPS-en / Pages-en aktív; file://-n a manifest
       ártalmatlan, a service worker regisztráció pedig nem fut le — lásd lent). -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Markdown" />

  <style>
  /* =======================================================================
     Markdown Megjelenítő & Szerkesztő — önálló, offline stíluslap
     (A Tailwindet kiváltó sima CSS + .markdown-body tipográfia + hljs téma.)
     Minden szín CSS-változón keresztül, a sötét módot a <html class="dark"> kapcsolja.
     ======================================================================= */

  :root {
    --bg: #f8fafc;          --fg: #1e293b;
    --panel: #ffffff;       --panel-2: #f1f5f9;
    --muted: #64748b;       --border: #e2e8f0;
    --accent: #0ea5e9;      --accent-fg: #ffffff;
    --link: #0284c7;
    --code-bg: #f1f5f9;     --code-fg: #be185d;
    --pre-bg: #f8fafc;      --pre-border: #e2e8f0;
    --shadow: rgba(15, 23, 42, .08);
    --header-bg: rgba(255,255,255,.9);
    /* highlight.js token színek */
    --hl-comment:#6a737d; --hl-keyword:#d73a49; --hl-string:#032f62;
    --hl-number:#005cc5;  --hl-title:#6f42c1;   --hl-attr:#005cc5;
    --hl-type:#e36209;    --hl-built:#e36209;   --hl-meta:#6a737d;
    --hl-tag:#22863a;     --hl-name:#22863a;    --hl-symbol:#e36209;
    --hl-deletion:#b31d28; --hl-deletion-bg:#ffeef0;
    --hl-addition:#22863a; --hl-addition-bg:#f0fff4;
  }
  html.dark {
    --bg: #0f172a;          --fg: #e2e8f0;
    --panel: #1e293b;       --panel-2: #0f172a;
    --muted: #94a3b8;       --border: #334155;
    --accent: #0ea5e9;      --accent-fg: #ffffff;
    --link: #38bdf8;
    --code-bg: #1e293b;     --code-fg: #f472b6;
    --pre-bg: #0f172a;      --pre-border: #334155;
    --shadow: rgba(0,0,0,.4);
    --header-bg: rgba(30,41,59,.9);
    --hl-comment:#8b949e; --hl-keyword:#ff7b72; --hl-string:#a5d6ff;
    --hl-number:#79c0ff;  --hl-title:#d2a8ff;   --hl-attr:#79c0ff;
    --hl-type:#ffa657;    --hl-built:#ffa657;   --hl-meta:#8b949e;
    --hl-tag:#7ee787;     --hl-name:#7ee787;    --hl-symbol:#ffa657;
    --hl-deletion:#ffdcd7; --hl-deletion-bg:#67060c;
    --hl-addition:#aff5b4; --hl-addition-bg:#033a16;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  /* --- Biztonságos terület (S25 Ultra lekerekített sarkok / kameralyuk) --- */
  .safe-top    { padding-top: env(safe-area-inset-top); }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

  /* ----------------------------- Fejléc --------------------------------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    border-bottom: 1px solid var(--border);
    background: var(--header-bg);
    backdrop-filter: blur(8px);
  }
  .topbar-row {
    max-width: 80rem; margin: 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; gap: .5rem;
    padding: .5rem .75rem;
  }
  .brand {
    margin-right: auto;
    display: flex; align-items: center; gap: .5rem;
    font-size: 1.05rem; font-weight: 600;
  }
  .brand svg { width: 1.25rem; height: 1.25rem; color: var(--accent); }
  .brand .full { display: none; }
  @media (min-width: 640px) {
    .brand .full { display: inline; }
    .brand .short { display: none; }
  }

  .seg {
    display: inline-flex; padding: 2px;
    border: 1px solid var(--border); border-radius: .5rem;
  }
  .view-btn {
    border: 0; background: transparent;
    border-radius: .375rem; padding: .4rem .6rem;
    font-size: .875rem; font-weight: 500; color: var(--muted);
    transition: background-color .15s, color .15s;
  }
  .view-btn.active { background: var(--accent); color: var(--accent-fg); }
  .view-btn .full { display: none; }
  @media (min-width: 640px) {
    .view-btn .full { display: inline; }
    .view-btn .short { display: none; }
  }

  .actions { display: flex; align-items: center; gap: .25rem; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 40px; min-height: 40px;
    border: 0; background: transparent; border-radius: .5rem;
    transition: background-color .15s;
  }
  .icon-btn svg { width: 1.25rem; height: 1.25rem; }
  .icon-btn:hover  { background: var(--panel-2); }
  .icon-btn:active { background: var(--border); }

  /* --- A sötét/világos ikon a téma szerint --- */
  .icon-sun  { display: none; }
  html.dark .icon-sun  { display: block; }
  html.dark .icon-moon { display: none; }

  /* ----------------------------- Eszköztár ------------------------------ */
  .toolbar {
    max-width: 80rem; margin: 0 auto;
    display: flex; flex-wrap: nowrap; align-items: center; gap: 2px;
    padding: .25rem .5rem;
    border-top: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .toolbar::-webkit-scrollbar { height: 0; }
  .tool-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 38px; height: 34px; padding: 0 .5rem;
    border: 0; background: transparent; border-radius: .375rem;
    font-size: .85rem; color: var(--muted); white-space: nowrap;
    transition: background-color .15s;
  }
  .tool-btn:hover  { background: var(--panel-2); }
  .tool-btn:active { background: var(--border); }
  .tool-btn.italic { font-style: italic; }
  .tool-btn.strike { text-decoration: line-through; }
  .tool-btn.mono   { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .tool-sep { width: 1px; height: 20px; margin: 0 4px; background: var(--border); flex: none; }

  /* ----------------------------- Munkaterület --------------------------- */
  .workspace {
    flex: 1; min-height: 0;
    max-width: 80rem; width: 100%; margin: 0 auto;
    display: flex;
  }
  .pane { min-width: 0; flex: 1 1 50%; display: flex; flex-direction: column; }
  .pane-editor { border-right: 1px solid var(--border); }

  #editor {
    flex: 1; width: 100%; height: 100%;
    resize: none; border: 0; outline: none;
    background: transparent; color: var(--fg);
    padding: 1rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 15px; line-height: 1.7;
  }
  #editor::placeholder { color: var(--muted); }

  .pane-preview { overflow-y: auto; }
  #preview { max-width: 48rem; margin: 0 auto; padding: 1rem; }
  @media (min-width: 640px) { #preview { padding: 1.5rem; } }

  /* Nézet-módok (a .workspace data-view attribútuma vezérli) */
  .workspace[data-view="editor"]  .pane-preview { display: none; }
  .workspace[data-view="editor"]  .pane-editor  { border-right: 0; }
  .workspace[data-view="preview"] .pane-editor  { display: none; }

  /* Mobilon a megosztott nézet egymás alá kerül */
  @media (max-width: 767px) {
    .workspace[data-view="split"] { flex-direction: column; }
    .workspace[data-view="split"] .pane-editor {
      flex: 1 1 50%; border-right: 0; border-bottom: 1px solid var(--border);
    }
    .workspace[data-view="split"] .pane-preview { flex: 1 1 50%; }
  }

  /* ----------------------------- Állapotsor ----------------------------- */
  .statusbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: .375rem .75rem;
    border-top: 1px solid var(--border);
    background: var(--panel);
    font-size: .75rem; color: var(--muted);
  }
  #status { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #counts { margin-left: .5rem; flex: none; font-variant-numeric: tabular-nums; }

  /* ----------------------------- Drop overlay --------------------------- */
  .drop-overlay {
    position: fixed; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    background: rgba(14,165,233,.2); backdrop-filter: blur(2px);
    pointer-events: none;
  }
  .drop-overlay.show { display: flex; }
  .drop-card {
    border: 4px dashed var(--accent); border-radius: 1rem;
    background: var(--panel); color: var(--link);
    padding: 1.5rem 2rem; text-align: center;
    font-size: 1.125rem; font-weight: 600; box-shadow: 0 10px 30px var(--shadow);
  }
  .drop-card svg { width: 2.5rem; height: 2.5rem; display: block; margin: 0 auto .5rem; }

  /* =======================================================================
     Renderelt Markdown tipográfia
     ======================================================================= */
  .markdown-body { font-size: 16px; line-height: 1.7; word-wrap: break-word; }
  .markdown-body > *:first-child { margin-top: 0; }
  .markdown-body > *:last-child  { margin-bottom: 0; }

  .markdown-body h1, .markdown-body h2, .markdown-body h3,
  .markdown-body h4, .markdown-body h5, .markdown-body h6 {
    margin: 1.5em 0 .6em; font-weight: 600; line-height: 1.25;
  }
  .markdown-body h1 { font-size: 1.9em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .markdown-body h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  .markdown-body h3 { font-size: 1.25em; }
  .markdown-body h4 { font-size: 1.05em; }
  .markdown-body h5 { font-size: .95em; }
  .markdown-body h6 { font-size: .9em; color: var(--muted); }

  .markdown-body p { margin: 0 0 1em; }
  .markdown-body a { color: var(--link); text-decoration: none; }
  .markdown-body a:hover { text-decoration: underline; }
  .markdown-body strong { font-weight: 600; }

  .markdown-body ul, .markdown-body ol { margin: 0 0 1em; padding-left: 1.6em; }
  .markdown-body li { margin: .25em 0; }
  .markdown-body li > ul, .markdown-body li > ol { margin: .25em 0; }
  .markdown-body li.task-list-item { list-style: none; margin-left: -1.4em; }
  .markdown-body li.task-list-item input[type="checkbox"] { margin-right: .5em; }

  .markdown-body blockquote {
    margin: 0 0 1em; padding: .2em 1em;
    color: var(--muted); border-left: 4px solid var(--border);
  }
  .markdown-body hr { height: 1px; margin: 1.8em 0; border: 0; background: var(--border); }
  .markdown-body img { max-width: 100%; height: auto; border-radius: .5rem; }

  .markdown-body code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .88em; padding: .15em .4em; border-radius: .35em;
    background: var(--code-bg); color: var(--code-fg);
  }
  .markdown-body pre {
    margin: 0 0 1.2em; padding: 1em; overflow-x: auto;
    border-radius: .6rem; background: var(--pre-bg);
    border: 1px solid var(--pre-border); line-height: 1.5;
  }
  .markdown-body pre code {
    display: block; padding: 0; background: transparent; color: inherit; font-size: .875em;
  }

  .markdown-body table {
    display: block; width: max-content; max-width: 100%;
    margin: 0 0 1.2em; overflow-x: auto; border-collapse: collapse; font-size: .95em;
  }
  .markdown-body th, .markdown-body td {
    padding: .5em .9em; border: 1px solid var(--border); text-align: left;
  }
  .markdown-body th { font-weight: 600; background: var(--panel-2); }
  .markdown-body tr:nth-child(even) td { background: var(--panel-2); }

  .markdown-body:empty::before {
    content: "Az előnézet itt jelenik meg…"; color: var(--muted); font-style: italic;
  }

  /* =======================================================================
     highlight.js token színek (változó-alapú, light/dark)
     ======================================================================= */
  .hljs-comment, .hljs-quote { color: var(--hl-comment); font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-section, .hljs-doctag { color: var(--hl-keyword); }
  .hljs-string, .hljs-regexp, .hljs-meta .hljs-string { color: var(--hl-string); }
  .hljs-number, .hljs-bullet, .hljs-link { color: var(--hl-number); }
  .hljs-title, .hljs-title.function_, .hljs-function .hljs-title { color: var(--hl-title); }
  .hljs-attr, .hljs-attribute, .hljs-variable, .hljs-template-variable { color: var(--hl-attr); }
  .hljs-type, .hljs-class .hljs-title, .hljs-title.class_ { color: var(--hl-type); }
  .hljs-built_in, .hljs-builtin-name { color: var(--hl-built); }
  .hljs-meta { color: var(--hl-meta); }
  .hljs-tag { color: var(--hl-tag); }
  .hljs-name, .hljs-selector-id, .hljs-selector-class { color: var(--hl-name); }
  .hljs-symbol, .hljs-params { color: var(--hl-symbol); }
  .hljs-deletion { color: var(--hl-deletion); background: var(--hl-deletion-bg); }
  .hljs-addition { color: var(--hl-addition); background: var(--hl-addition-bg); }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: 600; }

  /* Görgetősáv finomítás */
  .pane-preview::-webkit-scrollbar { width: 10px; height: 10px; }
  .pane-preview::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  </style>
</head>
<body>
  <div class="app">

    <!-- Fejléc -->
    <header class="topbar safe-top">
      <div class="topbar-row">
        <h1 class="brand">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 4h16v16H4z" stroke-linejoin="round" />
            <path d="M7 15V9l2.5 3L12 9v6M16 9v4m0 2 0-2m0 0 1.5-1.5M16 13l-1.5-1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="full">Markdown Szerkesztő</span>
          <span class="short">Markdown</span>
        </h1>

        <div class="seg" role="group" aria-label="Nézet választó">
          <button data-view="editor" class="view-btn" title="Csak szerkesztő"><span class="full">Szerkesztő</span><span class="short" aria-hidden="true">✎</span></button>
          <button data-view="split" class="view-btn" title="Megosztott nézet"><span class="full">Megosztott</span><span class="short" aria-hidden="true">⬓</span></button>
          <button data-view="preview" class="view-btn" title="Csak előnézet"><span class="full">Előnézet</span><span class="short" aria-hidden="true">👁</span></button>
        </div>

        <div class="actions">
          <button id="open-btn" class="icon-btn" title="Fájl megnyitása" aria-label="Fájl megnyitása">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" stroke-linejoin="round"/></svg>
          </button>
          <button id="download-btn" class="icon-btn" title="Letöltés .md-ként" aria-label="Letöltés Markdownként">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="export-html-btn" class="icon-btn" title="Exportálás HTML-ként" aria-label="Exportálás HTML-ként">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 8-4 4 4 4m8-8 4 4-4 4m-2-12-4 16" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="clear-btn" class="icon-btn" title="Tartalom törlése" aria-label="Tartalom törlése">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7h14M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-7 0v12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="theme-btn" class="icon-btn" title="Sötét mód váltása" aria-label="Sötét mód váltása">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke-linejoin="round"/></svg>
          </button>
          <input id="file-input" type="file" accept=".md,.markdown,.mdown,.mkd,.txt" hidden />
        </div>
      </div>

      <!-- Eszköztár -->
      <div id="toolbar" class="toolbar">
        <button class="tool-btn" data-md="bold" title="Félkövér (Ctrl+B)"><b>B</b></button>
        <button class="tool-btn italic" data-md="italic" title="Dőlt (Ctrl+I)">I</button>
        <button class="tool-btn strike" data-md="strike" title="Áthúzott">S</button>
        <span class="tool-sep"></span>
        <button class="tool-btn" data-md="h1" title="Címsor 1">H1</button>
        <button class="tool-btn" data-md="h2" title="Címsor 2">H2</button>
        <button class="tool-btn" data-md="h3" title="Címsor 3">H3</button>
        <span class="tool-sep"></span>
        <button class="tool-btn" data-md="ul" title="Felsorolás">• Lista</button>
        <button class="tool-btn" data-md="ol" title="Számozott lista">1. Lista</button>
        <button class="tool-btn" data-md="task" title="Tennivaló lista">☑</button>
        <button class="tool-btn" data-md="quote" title="Idézet">❝</button>
        <span class="tool-sep"></span>
        <button class="tool-btn" data-md="link" title="Hivatkozás (Ctrl+K)">🔗</button>
        <button class="tool-btn" data-md="image" title="Kép">🖼</button>
        <button class="tool-btn mono" data-md="code" title="Soron belüli kód">&lt;/&gt;</button>
        <button class="tool-btn mono" data-md="codeblock" title="Kódblokk">{ }</button>
        <button class="tool-btn" data-md="table" title="Táblázat">▦</button>
        <button class="tool-btn" data-md="hr" title="Elválasztó vonal">―</button>
      </div>
    </header>

    <!-- Fő terület -->
    <main id="workspace" class="workspace" data-view="split">
      <section class="pane pane-editor">
        <textarea id="editor" spellcheck="false" autocapitalize="off" autocorrect="off"
          placeholder="# Írj ide Markdownt…&#10;&#10;Vagy húzz be egy .md fájlt bárhová az ablakba."></textarea>
      </section>
      <section class="pane pane-preview">
        <article id="preview" class="markdown-body"></article>
      </section>
    </main>

    <!-- Lábléc / állapotsor -->
    <footer class="statusbar safe-bottom">
      <span id="status">Készen áll</span>
      <span id="counts">0 szó · 0 karakter</span>
    </footer>
  </div>

  <!-- Drag & drop overlay -->
  <div id="drop-overlay" class="drop-overlay">
    <div class="drop-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Húzd ide a Markdown fájlt
    </div>
  </div>

  <!-- =====================================================================
       Bevendorolt könyvtárak (offline, beágyazva) — marked, DOMPurify, highlight.js
       Build: tools/build.js injektálja a node_modules dist fájljait.
       ===================================================================== -->
  <!-- VENDOR_MARKED -->
  <!-- VENDOR_PURIFY -->
  <!-- VENDOR_HLJS -->

  <!-- =====================================================================
       PWA service worker regisztráció — CSAK https-en vagy localhoston fut.
       file://-ról megnyitva (letöltött egyfájlos verzió) szándékosan kimarad,
       hogy ne dobjon hibát; az app ott egyfájlosan, offline úgyis működik.
       ===================================================================== -->
  <script>
  (function () {
    'use strict';
    var ok = 'serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
    if (ok) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* csendben */ });
      });
    }
  })();
  </script>

  <!-- =====================================================================
       Alkalmazáslogika
       ===================================================================== -->
  <script>
  /* Markdown Megjelenítő & Szerkesztő — alkalmazáslogika (vanilla JS).
     Megerősítve: az eseménykezelők nem függnek egyetlen könyvtártól sem,
     a könyvtárhívások typeof-ellenőrzés és try/catch mögött vannak, így
     egy hiányzó lib soha nem bénítja meg a felületet. */
  (function () {
    'use strict';

    /* ----------------------------- DOM hivatkozások --------------------- */
    const editor      = document.getElementById('editor');
    const preview     = document.getElementById('preview');
    const workspace   = document.getElementById('workspace');
    const toolbar     = document.getElementById('toolbar');
    const statusEl    = document.getElementById('status');
    const countsEl    = document.getElementById('counts');
    const dropOverlay = document.getElementById('drop-overlay');
    const fileInput   = document.getElementById('file-input');

    const STORAGE = {
      content: 'md-editor:content',
      theme:   'md-editor:theme',
      view:    'md-editor:view',
    };

    const SAMPLE = [
      '# Üdv a Markdown Szerkesztőben! 👋',
      '',
      'Ez egy **reszponzív**, *tiszta*, teljesen **offline** megjelenítő és szerkesztő.',
      'Húzz be egy `.md` fájlt, vagy kezdj el gépelni.',
      '',
      '## Funkciók',
      '',
      '- [x] Élő megosztott előnézet',
      '- [x] Sötét mód 🌙',
      '- [x] Drag & drop fájlbehúzás',
      '- [x] Kódszínezés és táblázatok',
      '- [ ] A te jegyzeted…',
      '',
      '## Kódblokk',
      '',
      '```js',
      'function greet(name) {',
      "  return `Helló, ${name}!`;",
      '}',
      "console.log(greet('S25 Ultra'));",
      '```',
      '',
      '## Táblázat',
      '',
      '| Eszköz        | Platform | Optimalizált |',
      '| ------------- | -------- | :----------: |',
      '| Samsung S25 U | Android  |      ✅      |',
      '| Windows PC    | Desktop  |      ✅      |',
      '',
      '> 💡 Tipp: használd az eszköztár gombjait a gyors formázáshoz!',
      '',
    ].join('\n');

    /* ----------------------------- Segédfüggvények ---------------------- */
    function debounce(fn, wait) {
      let t;
      return function (...args) {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(this, args), wait);
      };
    }
    function setStatus(msg) { statusEl.textContent = msg; }
    function updateCounts(text) {
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      countsEl.textContent = `${words} szó · ${text.length} karakter`;
    }
    const hasMarked  = () => typeof window.marked !== 'undefined';
    const hasPurify  = () => typeof window.DOMPurify !== 'undefined';
    const hasHljs    = () => typeof window.hljs !== 'undefined';

    /* ----------------------------- marked beállítás --------------------- */
    function configureMarked() {
      if (!hasMarked()) return;
      try {
        window.marked.setOptions({ gfm: true, breaks: true, headerIds: true, mangle: false });
      } catch (_) { /* régebbi/újabb API eltérés — nem kritikus */ }
    }

    /* ----------------------------- Markdown → biztonságos HTML ---------- */
    function toHtml(raw) {
      if (!hasMarked()) {
        // Tartalék: nyers szöveg escape-elve, hogy lib nélkül is lássunk valamit.
        const esc = raw.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
        return '<pre>' + esc + '</pre>';
      }
      let html = window.marked.parse(raw);
      if (hasPurify()) html = window.DOMPurify.sanitize(html, { ADD_ATTR: ['target'] });
      return html;
    }

    /* ----------------------------- Renderelés --------------------------- */
    function render() {
      const raw = editor.value;
      try {
        preview.innerHTML = toHtml(raw);
        preview.querySelectorAll('a[href^="http"]').forEach((a) => {
          a.target = '_blank'; a.rel = 'noopener noreferrer';
        });
        if (hasHljs()) {
          preview.querySelectorAll('pre code').forEach((block) => {
            try { window.hljs.highlightElement(block); } catch (_) {}
          });
        }
      } catch (err) {
        setStatus('Renderelési hiba (a szerkesztő működik)');
      }
      updateCounts(raw);
    }
    const renderDebounced = debounce(render, 120);
    const persist = debounce(() => {
      try { localStorage.setItem(STORAGE.content, editor.value); } catch (_) {}
      setStatus('Automatikusan mentve');
    }, 400);

    editor.addEventListener('input', () => { renderDebounced(); persist(); });

    /* ----------------------------- Sötét mód ---------------------------- */
    function applyTheme(theme) {
      document.documentElement.classList.toggle('dark', theme === 'dark');
      try { localStorage.setItem(STORAGE.theme, theme); } catch (_) {}
    }
    function initTheme() {
      let theme = null;
      try { theme = localStorage.getItem(STORAGE.theme); } catch (_) {}
      if (!theme) {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      applyTheme(theme);
    }
    document.getElementById('theme-btn').addEventListener('click', () => {
      applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
    });

    /* ----------------------------- Nézetváltó --------------------------- */
    function setView(view) {
      workspace.dataset.view = view;
      document.querySelectorAll('.view-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      try { localStorage.setItem(STORAGE.view, view); } catch (_) {}
    }
    document.querySelectorAll('.view-btn').forEach((btn) => {
      btn.addEventListener('click', () => setView(btn.dataset.view));
    });

    /* ----------------------------- Eszköztár ---------------------------- */
    function surround(before, after, placeholder) {
      after = after === undefined ? before : after;
      const start = editor.selectionStart, end = editor.selectionEnd, val = editor.value;
      const selected = val.slice(start, end) || placeholder || '';
      editor.setRangeText(before + selected + after, start, end, 'end');
      if (!val.slice(start, end) && placeholder) {
        editor.selectionStart = start + before.length;
        editor.selectionEnd = start + before.length + placeholder.length;
      }
      editor.focus(); afterToolbarEdit();
    }
    function linePrefix(prefix) {
      const start = editor.selectionStart, end = editor.selectionEnd, val = editor.value;
      const lineStart = val.lastIndexOf('\n', start - 1) + 1;
      const block = val.slice(lineStart, end);
      const numbered = prefix === '1. ';
      const newBlock = block.split('\n')
        .map((line, i) => (numbered ? `${i + 1}. ` : prefix) + line).join('\n');
      editor.setRangeText(newBlock, lineStart, end, 'end');
      editor.focus(); afterToolbarEdit();
    }
    function insertBlock(text) {
      const start = editor.selectionStart, val = editor.value;
      const needsNlBefore = start > 0 && val[start - 1] !== '\n';
      editor.setRangeText((needsNlBefore ? '\n\n' : '') + text + '\n', start, editor.selectionEnd, 'end');
      editor.focus(); afterToolbarEdit();
    }
    function afterToolbarEdit() { render(); persist(); }

    const ACTIONS = {
      bold:      () => surround('**', '**', 'félkövér szöveg'),
      italic:    () => surround('*', '*', 'dőlt szöveg'),
      strike:    () => surround('~~', '~~', 'áthúzott'),
      code:      () => surround('`', '`', 'kód'),
      h1:        () => linePrefix('# '),
      h2:        () => linePrefix('## '),
      h3:        () => linePrefix('### '),
      ul:        () => linePrefix('- '),
      ol:        () => linePrefix('1. '),
      task:      () => linePrefix('- [ ] '),
      quote:     () => linePrefix('> '),
      link:      () => surround('[', '](https://)', 'link szöveg'),
      image:     () => surround('![', '](https://)', 'alt szöveg'),
      codeblock: () => insertBlock('```\nkód ide\n```'),
      table:     () => insertBlock('| Fejléc 1 | Fejléc 2 |\n| -------- | -------- |\n| Cella    | Cella    |'),
      hr:        () => insertBlock('---'),
    };
    toolbar.addEventListener('click', (e) => {
      const btn = e.target.closest('.tool-btn');
      if (btn && ACTIONS[btn.dataset.md]) ACTIONS[btn.dataset.md]();
    });
    editor.addEventListener('keydown', (e) => {
      if (!(e.ctrlKey || e.metaKey)) return;
      const key = e.key.toLowerCase();
      if (key === 'b') { e.preventDefault(); ACTIONS.bold(); }
      else if (key === 'i') { e.preventDefault(); ACTIONS.italic(); }
      else if (key === 'k') { e.preventDefault(); ACTIONS.link(); }
    });

    /* ----------------------------- Fájlműveletek ------------------------ */
    function loadText(text, name) {
      editor.value = text; render(); persist();
      setStatus(name ? `Betöltve: ${name}` : 'Betöltve');
    }
    function readFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => loadText(String(e.target.result), file.name);
      reader.onerror = () => setStatus('Hiba a fájl olvasásakor');
      reader.readAsText(file);
    }
    document.getElementById('open-btn').addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => { readFile(e.target.files[0]); fileInput.value = ''; });

    function downloadBlob(content, filename, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }
    document.getElementById('download-btn').addEventListener('click', () => {
      downloadBlob(editor.value, 'dokumentum.md', 'text/markdown;charset=utf-8');
      setStatus('Letöltve: dokumentum.md');
    });
    document.getElementById('export-html-btn').addEventListener('click', () => {
      downloadBlob(buildStandaloneHtml(), 'dokumentum.html', 'text/html;charset=utf-8');
      setStatus('Exportálva: dokumentum.html');
    });

    // Önálló, offline HTML export: a már renderelt (és színezett) tartalom +
    // beágyazott, változó nélküli stílus, hogy külső kérés nélkül is jól nézzen ki.
    function buildStandaloneHtml() {
      const body = preview.innerHTML;
      const css = `
  body{max-width:820px;margin:2rem auto;padding:0 1rem;font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1e293b;}
  h1,h2{border-bottom:1px solid #e2e8f0;padding-bottom:.3em;}
  a{color:#0284c7;} pre{background:#f8fafc;border:1px solid #e2e8f0;border-radius:.6rem;padding:1em;overflow-x:auto;}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;}
  :not(pre)>code{background:#f1f5f9;color:#be185d;padding:.15em .4em;border-radius:.35em;}
  table{border-collapse:collapse;} th,td{border:1px solid #e2e8f0;padding:.5em .9em;}
  th{background:#f8fafc;} blockquote{border-left:4px solid #cbd5e1;margin:0;padding:.2em 1em;color:#64748b;}
  img{max-width:100%;}
  .hljs-comment,.hljs-quote{color:#6a737d;font-style:italic;} .hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-section{color:#d73a49;}
  .hljs-string,.hljs-regexp{color:#032f62;} .hljs-number,.hljs-bullet,.hljs-link{color:#005cc5;} .hljs-title{color:#6f42c1;}
  .hljs-attr,.hljs-attribute,.hljs-variable{color:#005cc5;} .hljs-type,.hljs-built_in{color:#e36209;} .hljs-tag,.hljs-name{color:#22863a;}`;
      return '<!DOCTYPE html>\n<html lang="hu">\n<head>\n<meta charset="UTF-8">\n'
        + '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
        + '<title>Exportált Markdown</title>\n<style>' + css + '\n</style>\n</head>\n<body>\n'
        + body + '\n</body>\n</html>';
    }

    document.getElementById('clear-btn').addEventListener('click', () => {
      if (editor.value.trim() && !confirm('Biztosan törlöd a teljes tartalmat?')) return;
      loadText('', null); setStatus('Tartalom törölve'); editor.focus();
    });

    /* ----------------------------- Drag & drop -------------------------- */
    let dragDepth = 0;
    const isFileDrag = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
    function hideOverlay() { dropOverlay.classList.remove('show'); }
    window.addEventListener('dragenter', (e) => {
      if (!isFileDrag(e)) return;
      e.preventDefault(); dragDepth++; dropOverlay.classList.add('show');
    });
    window.addEventListener('dragover', (e) => { if (isFileDrag(e)) e.preventDefault(); });
    window.addEventListener('dragleave', (e) => {
      if (!isFileDrag(e)) return;
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) hideOverlay();
    });
    window.addEventListener('drop', (e) => {
      if (!isFileDrag(e)) return;
      e.preventDefault(); dragDepth = 0; hideOverlay();
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) readFile(file);
    });

    /* ----------------------------- Indítás ------------------------------ */
    function init() {
      initTheme();
      configureMarked();

      let view = null;
      try { view = localStorage.getItem(STORAGE.view); } catch (_) {}
      setView(view || 'split');

      let saved = null;
      try { saved = localStorage.getItem(STORAGE.content); } catch (_) {}
      editor.value = saved !== null ? saved : SAMPLE;

      render();
      setStatus(hasMarked() ? 'Készen áll' : 'Készen áll (megjelenítő könyvtár nélkül)');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
