<!DOCTYPE html>
<html lang="hu" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Reszponzív, tiszta dizájnú webes Markdown megjelenítő és szerkesztő — sötét móddal, drag & drop támogatással, kódszínezéssel és táblázatokkal. Mobilra és desktopra optimalizálva." />
  <title>Markdown Megjelenítő &amp; Szerkesztő</title>

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- highlight.js témák (a JS váltja a light/dark között a disabled attribútummal) -->
  <link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" />
  <link id="hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" disabled />

  <!-- Egyedi stílusok -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 antialiased">
  <div class="flex h-full flex-col">

    <!-- Fejléc -->
    <header class="safe-top sticky top-0 z-20 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-700 dark:bg-slate-800/90">
      <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-2 px-3 py-2 sm:px-4">
        <h1 class="mr-auto flex items-center gap-2 text-base font-semibold sm:text-lg">
          <svg class="h-5 w-5 text-sky-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 4h16v16H4z" stroke-linejoin="round" />
            <path d="M7 15V9l2.5 3L12 9v6M16 9v4m0 2 0-2m0 0 1.5-1.5M16 13l-1.5-1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="hidden sm:inline">Markdown Szerkesztő</span>
          <span class="sm:hidden">Markdown</span>
        </h1>

        <!-- Nézetváltó -->
        <div class="inline-flex rounded-lg border border-slate-300 p-0.5 dark:border-slate-600" role="group" aria-label="Nézet választó">
          <button data-view="editor" class="view-btn rounded-md px-2.5 py-1.5 text-sm font-medium" title="Csak szerkesztő">
            <span class="hidden sm:inline">Szerkesztő</span><span class="sm:hidden" aria-hidden="true">✎</span>
          </button>
          <button data-view="split" class="view-btn rounded-md px-2.5 py-1.5 text-sm font-medium" title="Megosztott nézet">
            <span class="hidden sm:inline">Megosztott</span><span class="sm:hidden" aria-hidden="true">⬓</span>
          </button>
          <button data-view="preview" class="view-btn rounded-md px-2.5 py-1.5 text-sm font-medium" title="Csak előnézet">
            <span class="hidden sm:inline">Előnézet</span><span class="sm:hidden" aria-hidden="true">👁</span>
          </button>
        </div>

        <!-- Műveletek -->
        <div class="flex items-center gap-1">
          <button id="open-btn" class="icon-btn" title="Fájl megnyitása">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" stroke-linejoin="round"/></svg>
          </button>
          <button id="download-btn" class="icon-btn" title="Letöltés .md-ként">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="export-html-btn" class="icon-btn" title="Exportálás HTML-ként">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 8-4 4 4 4m8-8 4 4-4 4m-2-12-4 16" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="clear-btn" class="icon-btn" title="Tartalom törlése">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7h14M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-7 0v12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="theme-btn" class="icon-btn" title="Sötét mód váltása">
            <svg class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/></svg>
            <svg class="block h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke-linejoin="round"/></svg>
          </button>
          <input id="file-input" type="file" accept=".md,.markdown,.mdown,.mkd,.txt" class="hidden" />
        </div>
      </div>

      <!-- Eszköztár -->
      <div id="toolbar" class="mx-auto flex max-w-7xl flex-wrap items-center gap-0.5 overflow-x-auto border-t border-slate-100 px-2 py-1 dark:border-slate-700/50">
        <button class="tool-btn" data-md="bold" title="Félkövér (Ctrl+B)"><b>B</b></button>
        <button class="tool-btn italic" data-md="italic" title="Dőlt (Ctrl+I)">I</button>
        <button class="tool-btn line-through" data-md="strike" title="Áthúzott">S</button>
        <span class="tool-sep"></span>
        <button class="tool-btn" data-md="h1" title="Címsor 1">H1</button>
        <button class="tool-btn" data-md="h2" title="Címsor 2">H2</button>
        <button class="tool-btn" data-md="h3" title="Címsor 3">H3</button>
        <span class="tool-sep"></span>
        <button class="tool-btn" data-md="ul" title="Felsorolás">• Lista</button>
        <button class="tool-btn" data-md="ol" title="Számozott lista">1. Lista</button>
        <button class="tool-btn" data-md="task" title="Tennivaló lista">☑</button>
        <button class="tool-btn" data-md="quote" title="Idézet">❝</button>
        <span class="tool-sep"></span>
        <button class="tool-btn" data-md="link" title="Hivatkozás (Ctrl+K)">🔗</button>
        <button class="tool-btn" data-md="image" title="Kép">🖼</button>
        <button class="tool-btn font-mono" data-md="code" title="Soron belüli kód">&lt;/&gt;</button>
        <button class="tool-btn font-mono" data-md="codeblock" title="Kódblokk">{ }</button>
        <button class="tool-btn" data-md="table" title="Táblázat">▦</button>
        <button class="tool-btn" data-md="hr" title="Elválasztó vonal">―</button>
      </div>
    </header>

    <!-- Fő terület -->
    <main id="workspace" class="mx-auto flex w-full max-w-7xl flex-1 overflow-hidden" data-view="split">
      <!-- Szerkesztő -->
      <section id="editor-pane" class="flex min-w-0 flex-1 flex-col border-r border-slate-200 dark:border-slate-700">
        <textarea id="editor"
          class="h-full w-full flex-1 resize-none bg-transparent p-4 font-mono text-[15px] leading-relaxed outline-none placeholder:text-slate-400 sm:text-sm"
          spellcheck="false" autocapitalize="off" autocorrect="off"
          placeholder="# Írj ide Markdownt…&#10;&#10;Vagy húzz be egy .md fájlt bárhová az ablakba."></textarea>
      </section>

      <!-- Előnézet -->
      <section id="preview-pane" class="min-w-0 flex-1 overflow-y-auto">
        <article id="preview" class="markdown-body mx-auto max-w-3xl p-4 sm:p-6"></article>
      </section>
    </main>

    <!-- Lábléc / állapotsor -->
    <footer class="safe-bottom flex items-center justify-between border-t border-slate-200 bg-white px-3 py-1.5 text-xs text-slate-500 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-400">
      <span id="status" class="truncate">Készen áll</span>
      <span id="counts" class="ml-2 shrink-0 tabular-nums">0 szó · 0 karakter</span>
    </footer>
  </div>

  <!-- Drag & drop overlay -->
  <div id="drop-overlay" class="pointer-events-none fixed inset-0 z-50 hidden items-center justify-center bg-sky-500/20 backdrop-blur-sm">
    <div class="rounded-2xl border-4 border-dashed border-sky-500 bg-white/90 px-8 py-6 text-center text-lg font-semibold text-sky-700 shadow-xl dark:bg-slate-800/90 dark:text-sky-300">
      <svg class="mx-auto mb-2 h-10 w-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Húzd ide a Markdown fájlt
    </div>
  </div>

  <!-- Könyvtárak -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <!-- Alkalmazás -->
  <script src="js/app.js"></script>
</body>
</html>
